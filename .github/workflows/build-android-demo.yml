name: Build Android Demo Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign Release APKs
        run: |
          keytool -genkey -v -keystore release.keystore -alias demo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 123456 -keypass 123456 -dname "CN=Demo"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          mkdir -p signed-apks

          for apk in $(find example -path "*/outputs/apk/release/*.apk"); do
            base=$(basename "$apk" .apk)
            "$BUILD_TOOLS/zipalign" -f -v 4 "$apk" "signed-apks/${base}-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-pass pass:123456 \
              --key-pass pass:123456 \
              --out "signed-apks/${base}-signed.apk" \
              "signed-apks/${base}-aligned.apk"
            rm "signed-apks/${base}-aligned.apk"
          done

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: compose-hig-demo-release-apk
          path: signed-apks/*-signed.apk
          if-no-files-found: error
